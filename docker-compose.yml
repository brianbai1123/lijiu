# 本机 Docker Desktop 启停：
#   启动  docker compose up -d --build
#   停止  docker compose stop
#   日志  docker compose logs -f
#   销毁  docker compose down
#
# 源码目录挂载到容器，Cursor 里改文件后浏览器自动热更新。

services:
  web:
    build: .
    container_name: lijiu
    ports:
      - "43127:43127"
    volumes:
      # 整个项目挂进去，改 src / CSS / 配置立刻生效
      - .:/app
      # 依赖与构建缓存用命名卷，避免被宿主机空目录或跨平台 node_modules 覆盖
      - lijiu_node_modules:/app/node_modules
      - lijiu_next:/app/.next
    environment:
      NODE_ENV: development
      # Docker Desktop（macOS / Windows）文件监听常不可靠，强制轮询
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLL_INTERVAL: "1000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  lijiu_node_modules:
  lijiu_next:
